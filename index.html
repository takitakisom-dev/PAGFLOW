<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PAGFLOW V24 FIX CHAVE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>:root{--bg:#f8fafc;--card:#fff;--card2:#eef2ff;--line:#e0e7ff;--text:#0f172a;--blue:#2563eb;--green:#16a34a;--red:#dc2626;--muted:#475569}
*{box-sizing:border-box}body{margin:0;font-family:'Inter',system-ui;background:var(--bg);color:var(--text);font-weight:500}
b{font-weight:600 !important}header{padding:14px 18px;background:var(--blue);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;color:#fff}
#btnMenu{width:38px;height:38px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.15);color:#fff;font-weight:700;font-size:18px}
#sideMenu{position:fixed;top:0;left:-310px;width:300px;height:100%;background:var(--card);z-index:20;transition:.3s;overflow:auto;border-right:1px solid var(--line)}
#sideMenu.open{left:0}.menu-head{padding:18px;font-weight:700;background:var(--card2);color:var(--blue)}
.menu-item{padding:12px 18px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer;display:flex;justify-content:space-between}
.menu-item.active{background:var(--card2);font-weight:600;border-left:3px solid var(--blue);color:var(--blue)}
.menu-sep{padding:10px 18px 5px;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;background:var(--bg)}
#overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.3);z-index:15}#overlay.show{display:block}
main{padding:12px;max-width:460px;margin:0 auto}
.sum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.sum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.sum .small{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase}.sum b{display:block;margin-top:4px;font-size:15px;font-weight:700 !important}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.small{font-size:11px;color:var(--muted)}.label{font-size:12px;font-weight:600;margin-bottom:2px;display:block}
input,select{width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:14px}
.btn{width:100%;padding:14px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-weight:700;margin-top:8px;cursor:pointer}
.btn-green{background:var(--green)}.btn-red{background:var(--red)}.view{display:none}.view.active{display:block}
.pixBox{background:linear-gradient(135deg,var(--blue),#1e40af);color:#fff;border-radius:14px;padding:16px;margin:12px 0}
.badge{font-size:10px;border-radius:12px;padding:3px 8px;font-weight:600}.badge.dev{background:var(--red);color:#fff}
</style></head><body>
<div id="overlay" onclick="fecharMenu()"></div>
<div id="sideMenu">
<div class="menu-head">PAGFLOW V24 • FIX CHAVE</div>
<div class="menu-item active" onclick="irHome()"><span>🏠 Início</span></div>
<div class="menu-sep">BANKING</div>
<div class="menu-item" onclick="mudarCat('pix')"><span>💠 Receber Pix</span></div>
<div class="menu-item" onclick="mudarCat('pagar')"><span>📌 Contas a pagar</span><span class="badge dev" id="qtdMenu">0</span></div>
<div class="menu-sep">CONFIG CHAVE (NOVO)</div>
<div style="padding:10px"><button onclick="limparChaveInsistente()" style="width:100%;padding:12px;border:2px solid var(--red);border-radius:8px;background:#fff;font-weight:700;color:var(--red)">🧹 Apagar chave insistente e digitar nova</button><button onclick="restaurarBackup()" style="width:100%;padding:12px;border:2px solid var(--blue);border-radius:8px;background:var(--card2);font-weight:700;color:var(--blue);margin-top:8px">♻️ Restaurar meus R$ 6260 perdidos</button><div id="bkp" class="small" style="text-align:center;margin-top:6px"></div></div>
</div>
<header><div style="font-weight:700;letter-spacing:2px">PAGFLOW BANK</div><button id="btnMenu" onclick="abrirMenu()">☰</button></header>
<main>
<div id="viewHome" class="view active">
<div class="sum"><div><div class="small">A PAGAR</div><b id="tPagar" style="color:var(--red)">R$ 0,00</b></div><div><div class="small">A RECEBER</div><b id="tReceber" style="color:var(--green)">R$ 0,00</b></div><div><div class="small">SALDO BANK</div><b id="tSaldo" style="color:var(--blue)">R$ 0,00</b></div></div>

<div class="pixBox"><b>💠 Receber Pix - CHAVE ATUAL</b>
<div style="background:rgba(255,255,255,.15);border-radius:8px;padding:12px;margin-top:10px"><div style="font-size:11px;opacity:.8">Chave configurada agora:</div><b id="chavePix" style="font-size:15px;word-break:break-all">--</b><div id="detalheChave" style="font-size:11px;margin-top:6px;opacity:.9"></div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><button class="btn" style="background:#fff;color:var(--blue)" onclick="copiarPix()">📋 Copiar</button><button class="btn" style="background:#fbbf24;color:#000" onclick="trocarChave()">✏️ Trocar</button></div>
<button class="btn btn-green" onclick="simularPix()">🧪 Simular Pix R$ 500 - vai pro SALDO BANK</button>
<button class="btn" style="background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3)" onclick="limparChaveInsistente()">🗑️ Limpar chave insistente</button>
</div>

<div class="card"><b>💰 Extrato - Pra onde vai o Pix?</b><div id="extrato" style="margin-top:8px"></div></div>
<div class="card"><b>+ Adicionar rápido</b><select id="tipoHome" style="margin-top:8px"></select><input id="nomeHome" placeholder="Ex: LUZ" style="margin-top:6px"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><input id="valorHome" type="number" placeholder="Valor R$"><input id="dataHome" type="date"></div><button class="btn" onclick="salvarHome()">SALVAR</button></div>
</div>

<div id="viewLista" class="view"><div class="card">
<div id="pixView" style="display:none"><div class="pixBox" style="text-align:center"><b id="chavePix2">--</b><div style="margin-top:10px"><button class="btn" style="background:#fff;color:var(--blue)" onclick="copiarPix()">📋 Copiar chave</button></div></div></div>
<div id="normalView"><b id="tit">Contas</b><div id="lista"></div><div style="background:var(--card2);padding:12px;border-radius:10px;margin-top:12px;border:1px solid var(--line)"><select id="tipo" style="margin-top:6px"></select><input id="nome" placeholder="Nome" style="margin-top:6px"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><input id="valor" type="number" placeholder="Valor"><input id="data" type="date"></div><button class="btn" onclick="salvarCat()">SALVAR</button></div></div>
<button class="btn" style="background:#fff;color:var(--blue);border:1px solid var(--line)" onclick="irHome()">← Voltar</button>
</div></div>
</main>
<script>
const KEY_DB='pagflow_v23_fix';
const KEY_CHAVE='pagflow_pix_chave_unica_v24';
let DB=JSON.parse(localStorage.getItem(KEY_DB)||'null')||{pagar:[],receber:[],caixinha:[],extrato:[],aluguel:[],mercado:[],casa:[],pets:[],carro:[],combustivel:[],bancos:[],cartao:[],viagem:[]};
let CHAVE=localStorage.getItem(KEY_CHAVE)||localStorage.getItem('pagflow_pix_chave_real')||localStorage.getItem('pagflow_pix_chave')||'takitakisom@gmail.com';
// LIMPA CHAVES ANTIGAS INSISTENTES
localStorage.removeItem('pagflow_pix_chave');
localStorage.removeItem('pagflow_pix_chave_real');
localStorage.setItem(KEY_CHAVE, CHAVE);

let cat='pagar';
let TIPOS=JSON.parse(localStorage.getItem('pagflow_tipos_v11')||'[]')||["LUZ","Água","Internet"];
function salvarE(){localStorage.setItem(KEY_DB,JSON.stringify(DB));localStorage.setItem(KEY_CHAVE,CHAVE);document.getElementById('bkp').innerText='Salvo '+new Date().toLocaleTimeString();}
function abrirMenu(){document.getElementById('sideMenu').classList.add('open');document.getElementById('overlay').classList.add('show');}
function fecharMenu(){document.getElementById('sideMenu').classList.remove('open');document.getElementById('overlay').classList.remove('show');}
function irHome(){document.getElementById('viewHome').classList.add('active');document.getElementById('viewLista').classList.remove('active');fecharMenu();}
function mudarCat(c){cat=c;document.getElementById('viewHome').classList.remove('active');document.getElementById('viewLista').classList.add('active');if(c==='pix'){document.getElementById('pixView').style.display='block';document.getElementById('normalView').style.display='none';}else{document.getElementById('pixView').style.display='none';document.getElementById('normalView').style.display='block';document.getElementById('tit').innerText=c;}fecharMenu();if(c!=='pix')mostrar();atualizar();}
function renderT(){let html='<option value="">-- Escolha --</option>';TIPOS.forEach(t=>html+=`<option>${t}</option>`);document.getElementById('tipoHome').innerHTML=html;document.getElementById('tipo').innerHTML=html;}
function pm(it){return parseFloat(it.valor)||0;}
function mostrar(){let l=DB[cat]||[];let h='';l.forEach((it,i)=>{h+=`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)"><div><b>${it.nome}</b><div class="small">${it.data||''} • R$ ${pm(it).toFixed(2)}</div></div><button onclick="apagar(${i})" style="color:red;border:1px solid #ddd;padding:6px 8px;border-radius:6px">✕</button></div>`;});document.getElementById('lista').innerHTML=h||'Vazio';}
function atualizar(){let p=(DB.pagar||[]).reduce((a,i)=>a+pm(i),0);let r=(DB.receber||[]).reduce((a,i)=>a+pm(i),0);let pix=DB.extrato.reduce((a,i)=>a+pm(i),0);let saldo=r-p+pix;document.getElementById('tPagar').innerText='R$ '+p.toFixed(2);document.getElementById('tReceber').innerText='R$ '+r.toFixed(2);document.getElementById('tSaldo').innerText='R$ '+saldo.toFixed(2);document.getElementById('qtdMenu').innerText=DB.pagar.length;document.getElementById('chavePix').innerText=CHAVE;document.getElementById('chavePix2').innerText=CHAVE;document.getElementById('detalheChave').innerText=CHAVE.includes('@')?'E-mail (valida 100%) - única chave':CHAVE.length>15?'Aleatória (valida 100%)':'Celular/CPF';let ext='';if(DB.extrato.length===0)ext='<div class="small">Nenhum Pix ainda. Quando receber, aumenta o SALDO BANK azul aqui.</div>';else DB.extrato.slice().reverse().forEach(e=>{ext+=`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><div><b>💠 ${e.nome}</b><div class="small">${e.data}</div></div><b style="color:var(--green)">+ R$ ${pm(e).toFixed(2)}</b></div>`;});document.getElementById('extrato').innerHTML=ext;}
function salvarHome(){let nome=document.getElementById('nomeHome').value.trim()||document.getElementById('tipoHome').value;if(!nome)return alert('Nome');let v=document.getElementById('valorHome').value;let d=document.getElementById('dataHome').value;if(!v)return alert('Valor');DB.pagar.push({nome,valor:v,data:d});salvarE();document.getElementById('nomeHome').value='';document.getElementById('valorHome').value='';atualizar();mostrar();}
function salvarCat(){let nome=document.getElementById('nome').value.trim()||document.getElementById('tipo').value;if(!nome)return alert('Nome');let v=document.getElementById('valor').value;let d=document.getElementById('data').value;if(!v)return alert('Valor');if(!DB[cat])DB[cat]=[];DB[cat].push({nome,valor:v,data:d});salvarE();document.getElementById('nome').value='';document.getElementById('valor').value='';mostrar();atualizar();}
function apagar(i){DB[cat].splice(i,1);salvarE();mostrar();atualizar();}
function copiarPix(){let ta=document.createElement('textarea');ta.value=CHAVE;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');alert('Copiado: '+CHAVE);}catch{prompt('Copie:',CHAVE);}document.body.removeChild(ta);}
function trocarChave(){let n=prompt('Digite sua chave Pix REAL (e-mail, celular, CPF):',CHAVE);if(n===null)return;n=n.trim();if(!n)return;CHAVE=n;localStorage.setItem(KEY_CHAVE,CHAVE);localStorage.removeItem('pagflow_pix_chave');localStorage.removeItem('pagflow_pix_chave_real');salvarE();atualizar();alert('Nova chave salva: '+CHAVE+' - Agora é a única!');}
function limparChaveInsistente(){if(!confirm('Apagar chave insistente? Vai limpar todas as chaves antigas e deixar você digitar nova.'))return;localStorage.removeItem('pagflow_pix_chave');localStorage.removeItem('pagflow_pix_chave_real');localStorage.removeItem('pagflow_pix_chave_unica_v24');CHAVE='';let n=prompt('Digite sua chave Pix REAL agora (ex: takitakisom@gmail.com):','takitakisom@gmail.com');if(n&&n.trim()){CHAVE=n.trim();localStorage.setItem(KEY_CHAVE,CHAVE);salvarE();atualizar();alert('Chave nova: '+CHAVE);}else{atualizar();}}
function simularPix(){let v=prompt('Valor Pix recebido','500');if(v===null)return;v=parseFloat(v.replace(',','.'));if(!v)return;let n=prompt('De quem?','Pix Teste')||'Teste';DB.extrato.push({nome:n,valor:v,data:new Date().toLocaleString()});salvarE();atualizar();alert('Pix R$ '+v.toFixed(2)+' entrou no SALDO BANK! Veja no extrato.');}
function restaurarBackup(){
  let achou=[];
  for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(k&&k.startsWith('pagflow_')&&k!==KEY_DB&&k!==KEY_CHAVE){try{let d=JSON.parse(localStorage.getItem(k));let src=d.db||d;Object.keys(src).forEach(cat=>{if(Array.isArray(src[cat])&&cat!=='extrato'){if(src[cat].length>0) achou.push(k+': '+cat+'='+src[cat].length);}});}catch{}}}
  if(achou.length===0) return alert('Nenhum backup antigo encontrado. Seus R$ 6260 foram zerados mesmo.');
  if(!confirm('Encontrei backups antigos:\n'+achou.join('\n')+'\n\nRestaurar? Vai trazer seus R$ 6260 de volta (sem duplicar).'))return;
  let base={pagar:[],receber:[],caixinha:[],extrato:DB.extrato,aluguel:[],mercado:[],casa:[],pets:[],carro:[],combustivel:[]};
  let mapa=new Set();
  for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(k&&k.startsWith('pagflow_')&&k!==KEY_DB&&k!==KEY_CHAVE){try{let d=JSON.parse(localStorage.getItem(k));let src=d.db||d;Object.keys(src).forEach(c=>{if(Array.isArray(src[c])&&c!=='extrato'){src[c].forEach(it=>{if(it&&it.nome){let id=(it.nome+'|'+it.valor+'|'+it.data).toLowerCase();if(!mapa.has(c+'|'+id)){mapa.add(c+'|'+id);if(base[c]!==undefined) base[c].push(it); else base.pagar.push(it);}}});}});}catch{}}}
  DB=base; salvarE(); atualizar(); mostrar(); alert('Restaurado! A PAGAR agora deve voltar pra R$ 6260 aproximado.');
}
function exportarBKP(){let blob=new Blob([JSON.stringify({db:DB,chave:CHAVE},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='PAGFLOW_V24.json';a.click();}
document.getElementById('dataHome').valueAsDate=new Date();document.getElementById('data').valueAsDate=new Date();
renderT();atualizar();mostrar();salvarE();
</script></body></html>
